<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A5A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg)"/>
  
  <!-- Truck body -->
  <rect x="60" y="140" width="320" height="140" rx="12" fill="#F1F5F9"/>
  
  <!-- Cabin -->
  <path d="M380 180H440C452 180 462 190 462 202V280H380V180Z" fill="#F8FAFC"/>
  <rect x="390" y="190" width="50" height="40" rx="6" fill="#93C5FD"/>
  
  <!-- Trailer details -->
  <rect x="80" y="160" width="280" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="80" y="180" width="280" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="80" y="200" width="280" height="8" rx="4" fill="#E2E8F0"/>
  
  <!-- FleetControl branding on truck -->
  <rect x="100" y="220" width="200" height="40" rx="8" fill="#0F172A"/>
  <text x="120" y="248" fill="#2563EB" font-size="18" font-weight="bold" font-family="Poppins, Arial">FLEETCONTROL</text>
  
  <!-- Wheels -->
  <circle cx="140" cy="300" r="30" fill="#0F172A"/>
  <circle cx="140" cy="300" r="18" fill="#334155"/>
  <circle cx="140" cy="300" r="6" fill="#64748B"/>
  
  <circle cx="280" cy="300" r="30" fill="#0F172A"/>
  <circle cx="280" cy="300" r="18" fill="#334155"/>
  <circle cx="280" cy="300" r="6" fill="#64748B"/>
  
  <circle cx="420" cy="300" r="30" fill="#0F172A"/>
  <circle cx="420" cy="300" r="18" fill="#334155"/>
  <circle cx="420" cy="300" r="6" fill="#64748B"/>
  
  <!-- Lights -->
  <rect x="450" y="220" width="12" height="20" rx="3" fill="#F59E0B"/>
  <rect x="450" y="250" width="12" height="20" rx="3" fill="#EF4444"/>
  
  <!-- GPS badge -->
  <circle cx="400" cy="160" r="20" fill="#22C55E"/>
  <circle cx="400" cy="160" r="10" fill="white"/>
  
  <!-- Road -->
  <rect x="0" y="330" width="600" height="70" fill="#334155"/>
  <rect x="40" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  <rect x="140" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  <rect x="240" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  <rect x="340" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  <rect x="440" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  <rect x="540" y="360" width="60" height="6" rx="3" fill="#F59E0B"/>
  
  <!-- Info card overlay -->
  <rect x="480" y="60" width="100" height="80" rx="12" fill="white" opacity="0.95"/>
  <rect x="492" y="74" width="76" height="10" rx="5" fill="#1E3A5A"/>
  <rect x="492" y="92" width="50" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="492" y="108" width="76" height="20" rx="4" fill="#2563EB" opacity="0.15"/>
  <text x="505" y="122" fill="#2563EB" font-size="10" font-family="Poppins, Arial" font-weight="bold">En ligne</text>
</svg>
