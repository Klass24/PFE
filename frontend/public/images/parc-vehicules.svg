<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="640" height="420" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="300" width="640" height="120" fill="#CBD5E1"/>
  <!-- Parking lot asphalt -->
  <rect x="20" y="280" width="600" height="130" rx="4" fill="url(#asphalt)"/>
  <!-- Lane markings -->
  <rect x="20" y="340" width="600" height="3" fill="#F59E0B" opacity="0.8"/>
  <rect x="215" y="280" width="3" height="130" fill="#fff" opacity="0.5"/>
  <rect x="425" y="280" width="3" height="130" fill="#fff" opacity="0.5"/>
  <!-- Parking spots dashes -->
  <rect x="50" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="80" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="110" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="140" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="170" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="240" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="270" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="300" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="330" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="360" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>
  <rect x="390" y="282" width="2" height="12" fill="#fff" opacity="0.6"/>

  <!-- Building (warehouse) in background -->
  <rect x="100" y="160" width="440" height="130" fill="#E2E8F0"/>
  <rect x="100" y="150" width="440" height="20" fill="#CBD5E1"/>
  <!-- Warehouse doors -->
  <rect x="160" y="200" width="80" height="90" rx="2" fill="#94A3B8"/>
  <rect x="280" y="200" width="80" height="90" rx="2" fill="#94A3B8"/>
  <rect x="400" y="200" width="80" height="90" rx="2" fill="#94A3B8"/>
  <!-- Windows -->
  <rect x="130" y="165" width="30" height="20" rx="2" fill="#93C5FD"/>
  <rect x="480" y="165" width="30" height="20" rx="2" fill="#93C5FD"/>

  <!-- Truck 1 (blue, large) -->
  <g transform="translate(30, 220)">
    <!-- Trailer -->
    <rect x="0" y="15" width="130" height="55" rx="3" fill="#1E3A5A"/>
    <rect x="0" y="13" width="130" height="6" rx="2" fill="#0F172A"/>
    <!-- Cabin -->
    <rect x="132" y="20" width="50" height="50" rx="4" fill="#2563EB"/>
    <rect x="136" y="24" width="28" height="18" rx="2" fill="#93C5FD" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="25" cy="72" r="10" fill="#0F172A"/>
    <circle cx="25" cy="72" r="5" fill="#334155"/>
    <circle cx="90" cy="72" r="10" fill="#0F172A"/>
    <circle cx="90" cy="72" r="5" fill="#334155"/>
    <circle cx="158" cy="72" r="10" fill="#0F172A"/>
    <circle cx="158" cy="72" r="5" fill="#334155"/>
    <!-- Logo on trailer -->
    <text x="28" y="48" fill="#2563EB" font-size="11" font-family="Poppins, Arial" font-weight="bold">FLEETCONTROL</text>
    <!-- GPS badge -->
    <circle cx="165" cy="10" r="8" fill="#22C55E"/>
    <circle cx="165" cy="10" r="4" fill="white"/>
  </g>

  <!-- Truck 2 (orange, medium) -->
  <g transform="translate(250, 225)">
    <rect x="0" y="10" width="100" height="50" rx="3" fill="#F59E0B"/>
    <rect x="102" y="15" width="44" height="45" rx="4" fill="#FBBF24"/>
    <rect x="106" y="19" width="24" height="16" rx="2" fill="#93C5FD" opacity="0.8"/>
    <circle cx="20" cy="62" r="9" fill="#0F172A"/>
    <circle cx="20" cy="62" r="4" fill="#334155"/>
    <circle cx="75" cy="62" r="9" fill="#0F172A"/>
    <circle cx="75" cy="62" r="4" fill="#334155"/>
    <circle cx="136" cy="62" r="9" fill="#0F172A"/>
    <circle cx="136" cy="62" r="4" fill="#334155"/>
    <!-- GPS badge -->
    <circle cx="148" cy="5" r="8" fill="#22C55E"/>
    <circle cx="148" cy="5" r="4" fill="white"/>
  </g>

  <!-- Van (white) -->
  <g transform="translate(460, 240)">
    <rect x="0" y="5" width="80" height="42" rx="5" fill="#F1F5F9"/>
    <rect x="4" y="9" width="28" height="20" rx="2" fill="#93C5FD" opacity="0.9"/>
    <rect x="46" y="9" width="28" height="20" rx="2" fill="#93C5FD" opacity="0.9"/>
    <circle cx="16" cy="50" r="8" fill="#0F172A"/>
    <circle cx="16" cy="50" r="4" fill="#334155"/>
    <circle cx="64" cy="50" r="8" fill="#0F172A"/>
    <circle cx="64" cy="50" r="4" fill="#334155"/>
    <text x="20" y="34" fill="#2563EB" font-size="9" font-family="Poppins, Arial" font-weight="bold">FC-09</text>
  </g>

  <!-- Fence -->
  <rect x="0" y="275" width="640" height="8" fill="#64748B"/>

  <!-- Trees -->
  <rect x="580" y="200" width="8" height="80" fill="#78350F"/>
  <ellipse cx="584" cy="195" rx="22" ry="28" fill="#22C55E"/>
  <rect x="10" y="210" width="8" height="70" fill="#78350F"/>
  <ellipse cx="14" cy="205" rx="20" ry="25" fill="#16A34A"/>

  <!-- Sign -->
  <rect x="290" y="185" width="60" height="24" rx="3" fill="#2563EB"/>
  <text x="296" y="202" fill="#fff" font-size="11" font-family="Arial" font-weight="bold">PARC N°1</text>
  <rect x="319" y="209" width="3" height="25" fill="#505050"/>

  <!-- Labels -->
  <rect x="0" y="390" width="640" height="30" fill="#1F2D3D" opacity="0.75"/>
  <text x="200" y="410" fill="#fff" font-size="13" font-family="Arial" font-weight="bold">Parc de véhicules — FleetControl</text>
</svg>