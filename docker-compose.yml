
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fleetcontrol_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
      - app_storage:/var/www/html/storage
    environment:
      - PHP_OPCACHE_ENABLE=1
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fleetcontrol

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: fleetcontrol_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - app
    environment:
      - VITE_API_URL=/api/v1
      - NODE_ENV=production
    networks:
      - fleetcontrol

  nginx:
    image: nginx:1.25-alpine
    container_name: fleetcontrol_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
      - "127.0.0.1:6443:443"
    volumes:
      - app_code:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fleetcontrol

  mysql:
    image: mysql:8.0
    container_name: fleetcontrol_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fleetcontrol}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-fleetcontrol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fleetcontrol}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetcontrol

  redis:
    image: redis:7-alpine
    container_name: fleetcontrol_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - fleetcontrol

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fleetcontrol_pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fleetcontrol

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fleetcontrol_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=default,notifications
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - fleetcontrol

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fleetcontrol_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - fleetcontrol

  mobile_web:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:8080/api/v1}
    container_name: fleetcontrol_mobile_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - app
    networks:
      - fleetcontrol

  android-emulator:
    image: budtmo/docker-android:emulator_14.0
    container_name: fleetcontrol_android_emulator
    privileged: true
    ports:
      - "127.0.0.1:6080:6080"   # noVNC web interface
      - "127.0.0.1:5554:5554"   # ADB
      - "127.0.0.1:5555:5555"   # ADB
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - DATAPARTITION=4g
    volumes:
      - android_data:/root/.android
    networks:
      - fleetcontrol

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_code:
    driver: local
  app_storage:
    driver: local
  android_data:
    driver: local

networks:
  fleetcontrol:
    driver: bridge
