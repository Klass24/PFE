# ==================================================
# SONARCLOUD - CONFIGURATION DU PROJET SYMFONY
# ==================================================

# Identifiants SonarCloud : à remplacer par tes vraies valeurs
sonar.projectKey=Klass24_PFE
sonar.organization=klass24

# Encodage
sonar.sourceEncoding=UTF-8

# Répertoires du projet
sonar.sources=src
sonar.tests=tests

# Rapport de couverture PHPUnit au format Clover XML
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions du code source
sonar.exclusions=vendor/**,var/**,public/bundles/**,migrations/**

# Exclusions des tests
sonar.test.exclusions=vendor/**,var/**

# Ne pas analyser les fichiers de dépendances et de cache
sonar.coverage.exclusions=vendor/**,var/**,migrations/**