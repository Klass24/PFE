apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pfe.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ include "pfe.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "pfe.fullname" . }}-backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pfe.fullname" .) }}
      {{- if .Values.image.usePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repositoryBackend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.backend.port }}
          env:
            - name: DB_HOST
              value: {{ default "mysql" .Values.config.DB_HOST | quote }}
            - name: DB_PORT
              value: "{{ .Values.config.DB_PORT | default "3306" }}"
            - name: DB_DATABASE
              value: "{{ .Values.mysql.database }}"
            - name: DB_USERNAME
              value: "{{ .Values.mysql.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pfe.fullname" . }}-mysql-secret
                  key: mysql-password
          resources:
            requests:
              cpu: {{ .Values.resources.backend.requests.cpu }}
              memory: {{ .Values.resources.backend.requests.memory }}
            limits:
              cpu: {{ .Values.resources.backend.limits.cpu }}
              memory: {{ .Values.resources.backend.limits.memory }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: {{ .Values.probes.backend.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.backend.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.backend.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.backend.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.probes.backend.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.backend.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.backend.failureThreshold }}

