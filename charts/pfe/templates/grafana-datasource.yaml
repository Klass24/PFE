{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pfe.fullname" . }}-grafana-datasource
  labels:
    app: {{ include "pfe.fullname" . }}-grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: {{ .Values.grafana.datasource.name }}
        type: {{ .Values.grafana.datasource.type }}
        url: {{ .Values.grafana.datasource.url }}
        access: proxy
        isDefault: true
{{- end }}
