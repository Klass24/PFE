{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pfe.fullname" . }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: 'pfe-backend'
        static_configs:
          - targets: ['{{ include "pfe.fullname" . }}-backend:{{ .Values.service.backend.port }}']
        metrics_path: '/api/metrics'
        scrape_interval: 15s
      - job_name: 'pfe-frontend'
        static_configs:
          - targets: ['{{ include "pfe.fullname" . }}-frontend:{{ .Values.service.frontend.port }}']
        metrics_path: '/metrics'
        scrape_interval: 15s
{{- end }}
